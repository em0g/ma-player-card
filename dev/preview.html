<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MA Player Card – layouts</title>
    <style>
      body { margin: 0; padding: 24px; background: #111; font-family: system-ui, sans-serif; color: #ddd; }
      body.light { background: #f2f2f2; color: #222; --primary-text-color: #212121; --secondary-text-color: #727272; --card-background-color: #fff; }
      h2 { font-size: 14px; font-weight: 600; margin: 24px 0 8px; opacity: 0.7; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 16px; align-items: start; }
      .narrow { max-width: 300px; }
